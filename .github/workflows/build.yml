name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using permanent keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "HAS_SECRET=true" >> $GITHUB_ENV
          else
            echo "Generating new release keystore..."
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias munkanaplo \
              -storepass Munkanaplo2026! \
              -keypass Munkanaplo2026! \
              -dname "CN=Munkanaplo, OU=App, O=Munkanaplo, L=Budapest, C=HU"
            mkdir -p keystore-backup
            cp app/release.jks keystore-backup/munkanaplo-release.jks
            base64 -w 0 app/release.jks > keystore-backup/keystore_base64.txt
            echo "HAS_SECRET=false" >> $GITHUB_ENV
          fi

      - name: Upload One-Time Keystore Backup (until secret is saved)
        if: env.HAS_SECRET == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE-EGYSZERI-MENTES
          path: keystore-backup/
          retention-days: 3

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'Munkanaplo2026!' }}
          KEY_ALIAS: munkanaplo
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'Munkanaplo2026!' }}
        run: ./gradlew assembleRelease

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/release/app-release.apk Munkanaplo.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Munkanapló (Legfrissebb verzió)
          body: |
            Közvetlen Android telepítőcsomag (`Munkanaplo.apk`).
            Telepítéshez koppints alul az **Assets** részben a **`Munkanaplo.apk`** fájlra.
          files: Munkanaplo.apk
          prerelease: false
          make_latest: true
